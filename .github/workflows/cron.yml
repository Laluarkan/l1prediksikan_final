name: AI Prediction Cronjob

on:
  schedule:
    # Mengeksekusi setiap hari pada pukul 18:00 UTC (02:00 WITA)
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  run_ai_pipeline:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      PYTHONPATH: ${{ github.workspace }}/website/backend
      PYTHONUNBUFFERED: "1"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Hanya menginstal pustaka yang dibutuhkan untuk scraping dan ML
        pip install -r website/backend/requirements.txt

    - name: Eksekusi Fetch History (Sinkronisasi Masa Lalu)
      working-directory: ./website/backend
      run: python manage.py fetch_history

    - name: Eksekusi Fetch Fixture (Prediksi Masa Depan)
      working-directory: ./website/backend
      run: python manage.py fetch_fixture