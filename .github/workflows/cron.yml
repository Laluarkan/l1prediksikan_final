name: AI Prediction Cronjob

on:
  schedule:
    # Mengeksekusi setiap hari pada pukul 18:00 UTC (02:00 WITA)
    - cron: '0 18 * * *'
    
  workflow_dispatch: 

jobs:
  trigger_celery_tasks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Render API Endpoint
        run: |
          curl -X GET "https://l1prediksi-api.onrender.com/api/cron-trigger/" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET_KEY }}"