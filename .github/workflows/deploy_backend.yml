name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'website/backend/**'
      - '.github/workflows/deploy_backend.yml'
  workflow_dispatch: # Mengizinkan deploy manual kapan saja melalui tab Actions di GitHub

jobs:
  deploy_to_render:
    name: Trigger Instant Deploy on Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Memicu instant deployment via Render Deploy Hook..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

            echo "HTTP Status dari Render: $HTTP_STATUS"
            echo "Respons: $BODY"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "BERHASIL: Sinyal deploy telah diterima oleh Render! Proses build & deploy langsung berjalan di server."
            else
              echo "GAGAL: Render merespons dengan kode error $HTTP_STATUS."
              exit 1
            fi

          elif [ -n "${{ secrets.RENDER_API_KEY }}" ] && [ -n "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "Memicu instant deployment via Render API v1..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys")
            
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

            echo "HTTP Status dari Render: $HTTP_STATUS"
            echo "Respons: $BODY"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "BERHASIL: Deploy API berhasil dipicu ke Render!"
            else
              echo "GAGAL: Render API merespons dengan kode error $HTTP_STATUS."
              exit 1
            fi

          else
            echo "PERINGATAN: Secret RENDER_DEPLOY_HOOK_URL belum didaftarkan di GitHub Repository Secrets."
            echo "Panduan langkah pendaftaran secret:"
            echo "1. Buka Dashboard Render -> Pilih Web Service Anda -> Settings -> Deploy Hook."
            echo "2. Salin URL Deploy Hook (format: https://api.render.com/deploy/srv-xxxx?key=yyyy)."
            echo "3. Buka GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "4. Beri nama RENDER_DEPLOY_HOOK_URL dan paste URL tersebut."
            exit 1
          fi
