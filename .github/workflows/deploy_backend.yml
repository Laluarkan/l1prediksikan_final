name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'website/backend/**'
      - '.github/workflows/deploy_backend.yml'
  workflow_dispatch: # Mengizinkan deploy manual kapan saja melalui tab Actions di GitHub

jobs:
  deploy_to_render:
    name: Deploy & Monitor Render Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Trigger and Monitor Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          BACKEND_HEALTH_URL: 'https://l1prediksi-api.onrender.com/health/'
        run: |
          python - << 'EOF'
          import os
          import sys
          import time
          import re
          import json
          import urllib.request
          import urllib.error

          def log(icon, msg):
              timestamp = time.strftime('%H:%M:%S')
              print(f"[{timestamp}] {icon} {msg}", flush=True)

          hook_url = os.environ.get('RENDER_DEPLOY_HOOK_URL', '').strip()
          api_key = os.environ.get('RENDER_API_KEY', '').strip()
          service_id = os.environ.get('RENDER_SERVICE_ID', '').strip()
          health_url = os.environ.get('BACKEND_HEALTH_URL', 'https://l1prediksi-api.onrender.com/health/').strip()

          # 1. Ekstraksi service_id jika tidak diset manual
          if not service_id and hook_url:
              match = re.search(r'(srv-[a-zA-Z0-9]+)', hook_url)
              if match:
                  service_id = match.group(1)

          log("🚀", "MEMULAI PROSES DEPLOYMENT BACKEND KE RENDER...")
          if service_id:
              log("ℹ️", f"Terdeteksi Service ID Render: {service_id}")

          deploy_id = None

          # 2. Pemicuan Deployment (Trigger Deploy)
          if hook_url:
              log("📡", "Mengirim sinyal pemicu deploy via Render Deploy Hook...")
              try:
                  req = urllib.request.Request(hook_url, method='POST')
                  req.add_header('User-Agent', 'GitHub-Action-Deploy-Monitor')
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      status_code = resp.getcode()
                      raw_body = resp.read().decode('utf-8')
                      log("✅", f"Sinyal diterima oleh Render (HTTP {status_code}).")
                      try:
                          res_json = json.loads(raw_body)
                          deploy_obj = res_json.get('deploy', res_json)
                          deploy_id = deploy_obj.get('id')
                      except Exception:
                          pass
              except urllib.error.HTTPError as e:
                  log("❌", f"Gagal memicu Deploy Hook: HTTP {e.code} - {e.read().decode('utf-8')}")
                  sys.exit(1)
              except Exception as e:
                  log("❌", f"Gagal menghubungi Render Deploy Hook: {e}")
                  sys.exit(1)

          elif api_key and service_id:
              log("📡", "Memicu deployment via Render REST API v1...")
              url = f"https://api.render.com/v1/services/{service_id}/deploys"
              try:
                  req = urllib.request.Request(url, data=b"{}", method='POST')
                  req.add_header('Authorization', f"Bearer {api_key}")
                  req.add_header('Content-Type', 'application/json')
                  req.add_header('Accept', 'application/json')
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      res_json = json.loads(resp.read().decode('utf-8'))
                      deploy_id = res_json.get('id')
                      log("✅", f"Deploy berhasil dipicu melalui API Render (Deploy ID: {deploy_id})")
              except Exception as e:
                  log("❌", f"Gagal memicu deploy via Render API: {e}")
                  sys.exit(1)
          else:
              log("❌", "ERROR: Secret RENDER_DEPLOY_HOOK_URL atau RENDER_API_KEY belum disetel di GitHub Secrets.")
              log("ℹ️", "Silakan tambahkan RENDER_DEPLOY_HOOK_URL di GitHub Repo -> Settings -> Secrets and variables -> Actions.")
              sys.exit(1)

          if deploy_id:
              log("🆔", f"Target Deploy ID: {deploy_id}")

          # 3. Monitoring Status Realtime (Jika RENDER_API_KEY tersedia)
          if api_key and service_id:
              log("⏳", "Menghubungkan ke Render API untuk memantau proses build & deploy secara LIVE...")
              start_time = time.time()
              last_status = None
              
              # Loop pemantauan hingga 15 menit (900 detik)
              max_timeout = 900
              while (time.time() - start_time) < max_timeout:
                  time.sleep(8)
                  elapsed = int(time.time() - start_time)
                  elapsed_str = f"{elapsed // 60}m {elapsed % 60}s"

                  try:
                      # Jika deploy_id belum ada, ambil deploy terbaru dari service
                      if not deploy_id:
                          list_url = f"https://api.render.com/v1/services/{service_id}/deploys?limit=1"
                          req = urllib.request.Request(list_url)
                          req.add_header('Authorization', f"Bearer {api_key}")
                          req.add_header('Accept', 'application/json')
                          with urllib.request.urlopen(req, timeout=20) as resp:
                              items = json.loads(resp.read().decode('utf-8'))
                              if items and isinstance(items, list):
                                  first_item = items[0]
                                  deploy_id = first_item.get('deploy', first_item).get('id')

                      if not deploy_id:
                          log("⏳", f"[{elapsed_str}] Menunggu Render menginisialisasi deploy...")
                          continue

                      detail_url = f"https://api.render.com/v1/services/{service_id}/deploys/{deploy_id}"
                      req = urllib.request.Request(detail_url)
                      req.add_header('Authorization', f"Bearer {api_key}")
                      req.add_header('Accept', 'application/json')
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          deploy_data = json.loads(resp.read().decode('utf-8'))
                          current_status = deploy_data.get('status', 'unknown')

                          if current_status != last_status:
                              last_status = current_status
                              if current_status == 'created':
                                  log("📋", f"[{elapsed_str}] Status: CREATED - Antrean build terdaftar di sistem Render.")
                              elif current_status == 'build_in_progress':
                                  log("🔨", f"[{elapsed_str}] Status: BUILD_IN_PROGRESS - Server sedang menginstall dependencies, collectstatic, & kompilasi.")
                              elif current_status == 'update_in_progress':
                                  log("🚀", f"[{elapsed_str}] Status: UPDATE_IN_PROGRESS - Build sukses! Instance baru sedang diluncurkan (zero-downtime swap).")
                              elif current_status == 'live':
                                  log("🎉", f"[{elapsed_str}] Status: LIVE - DEPLOYMENT SELESAI DAN SUDAH AKTIF DI PRODUKSI!")
                                  break
                              elif current_status in ['build_failed', 'update_failed', 'canceled', 'deactivated']:
                                  log("❌", f"[{elapsed_str}] Status: {current_status.upper()} - Deployment GAGAL di server Render.")
                                  sys.exit(1)
                              else:
                                  log("ℹ️", f"[{elapsed_str}] Status Render saat ini: {current_status}")
                          else:
                              # Cetak detak jantung setiap 24 detik jika status sama
                              if elapsed % 24 == 0:
                                  log("⏳", f"[{elapsed_str}] Masih dalam proses ({current_status})...")

                  except Exception as err:
                      log("⚠️", f"Gagal mengambil status deploy (akan coba lagi): {err}")

              if last_status != 'live':
                  log("⚠️", "Batas waktu pemantauan Render tercapai.")
          else:
              log("💡", "TIP: Daftarkan secret RENDER_API_KEY di GitHub Secrets untuk melihat progres fase build Render (created, building, live) secara presisi.")
              log("⏳", "Menunggu proses build & restart server Render selama 90 detik...")
              time.sleep(90)

          # 4. Verifikasi Akhir: Health Check Endpoint
          log("🔍", f"Melakukan verifikasi akhir ke Health Check Endpoint ({health_url})...")
          health_success = False
          for attempt in range(1, 10):
              try:
                  req = urllib.request.Request(health_url)
                  req.add_header('User-Agent', 'GitHub-Action-Health-Check')
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      if resp.getcode() == 200:
                          body = resp.read().decode('utf-8')
                          log("✅", f"Health Check BERHASIL (Percobaan ke-{attempt}): {body}")
                          health_success = True
                          break
              except Exception as e:
                  log("⏳", f"Menunggu API online (Percobaan ke-{attempt}/9): {e}")
                  time.sleep(10)

          if health_success:
              print("\n" + "="*60, flush=True)
              log("🏆", "ALL DONE! Backend di Render telah berhasil di-deploy dan siap melayani request pengguna!")
              print("="*60 + "\n", flush=True)
          else:
              log("⚠️", "Peringatan: Health check belum memberikan respons 200, namun proses deploy di Render telah selesai.")
          EOF
