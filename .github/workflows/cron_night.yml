name: AI Prediction - Night Run (22:25 UTC / 05:25 WIB)

on:
  schedule:
    # 22:25 UTC = 05:25 WIB / 06:25 WITA (Dini hari/pagi setelah seluruh laga malam Eropa tuntas)
    # Menggunakan menit non-00 (25) untuk menghindari antrean penundaan GitHub Actions
    - cron: '25 22 * * *'
  workflow_dispatch:

jobs:
  run_ai_pipeline:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}/website/backend
      PYTHONUNBUFFERED: "1"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r website/backend/requirements.txt

    - name: Eksekusi Fetch Fixture (Prediksi Masa Depan)
      working-directory: ./website/backend
      run: python manage.py fetch_fixture

    - name: Eksekusi Fetch History (Sinkronisasi Masa Lalu)
      working-directory: ./website/backend
      run: python manage.py fetch_history

    - name: Pembuatan Otomatis Berita & Preview Pertandingan (SEO Engine)
      working-directory: ./website/backend
      run: python manage.py generate_articles

    - name: Bersihkan Cache Redis di Server Render
      if: always()
      run: |
        curl -s -X POST https://l1prediksi-api.onrender.com/api/clear-cache/ \
          -H "X-Sync-Secret: ${{ secrets.SYNC_SECRET_KEY }}" || echo "Cache webhook selesai"

