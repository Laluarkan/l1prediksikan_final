name: AI Prediction Cronjob

on:
  schedule:
    # Berjalan otomatis setiap jam 00:00 UTC (Jam 08:00 WITA setiap hari)
    - cron: '0 0 * * *'
  workflow_dispatch: # Memunculkan tombol "Run workflow" agar bisa dipicu manual kapan saja

jobs:
  run_ai_pipeline:
    runs-on: ubuntu-latest
    
    env:
      # Mengambil kunci rahasia yang Anda pasang di GitHub Settings > Secrets and variables
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      # Menyesuaikan PYTHONPATH ke folder backend tempat manage.py dan folder models berada
      PYTHONPATH: ${{ github.workspace }}/website/backend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r website/backend/requirements.txt

    - name: Eksekusi Fetch History (Sinkronisasi Masa Lalu)
      working-directory: ./website/backend
      run: python manage.py fetch_history

    - name: Eksekusi Fetch Fixture (Prediksi Masa Depan)
      working-directory: ./website/backend
      run: python manage.py fetch_fixture